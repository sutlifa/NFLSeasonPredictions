<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NFL Predictions app icon">
  <!--
    The same mark as the site header (public/logo-mark.svg): navy shield,
    silver rim, red band, white football. Kept deliberately identical so the
    tab icon and the header read as one mark.

    Only the proportions differ, because this is read at 16px. The shield
    fills the whole canvas rather than sitting in padding, the rim and laces
    are thickened so they still land on a pixel, and the football and band
    are enlarged. Verified by rasterising to a real 16px canvas and
    magnifying the result, not by eyeballing it at 512.

    No tile behind it, unlike an earlier attempt. The mark already carries
    its own contrast: the silver rim and the red band hold it up against a
    dark tab strip, and the navy shield does the same against a light one,
    so a tile only made it heavier.

    NOTE FOR EDITORS: never put a double hyphen inside these comments. XML
    forbids it, and an SVG that fails to parse does not fall back to
    something plainer, it fails to render entirely. Chrome then silently
    shows its default globe, which is exactly how this file once shipped
    broken. scripts/check-svg.mjs guards against it at build time.

    Deliberately NOT a copy of the league's shield: this is an unaffiliated
    fan pool, so the mark borrows the palette and the silhouette family
    without imitating a trademark.
  -->

  <path
    d="M256 34 L458 94 V270 c0 106 -82 178 -202 206 C134 448 54 376 54 270 V94 Z"
    fill="#16294f"
    stroke="#c4cad6"
    stroke-width="26"
    stroke-linejoin="round"
  />

  <path d="M54 206 h404 v104 H54 Z" fill="#d50a0a"/>

  <ellipse cx="256" cy="252" rx="128" ry="78" fill="#ffffff"/>
  <g stroke="#0a1430" stroke-width="24" stroke-linecap="round">
    <path d="M146 252 H366"/>
    <path d="M222 222 V282"/>
    <path d="M290 222 V282"/>
  </g>
</svg>
