<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NFL Predictions app icon">
  <!--
    The header mark (public/logo-mark.svg) redrawn for small sizes. A favicon
    is read at 16px, where that version falls apart: its 2.5px shield outline
    lands on a third of a pixel, and the football's four laces collapse into
    one grey smear. So this keeps only what survives -- the shield
    silhouette, one red band, one white ball -- and thickens every stroke.

    Same four colours as the site, and deliberately the same silhouette, so
    the tab icon and the header read as the same mark rather than two.

    Deliberately NOT a copy of the league's shield: this is an unaffiliated
    fan pool, so the mark borrows the palette and the silhouette family
    without imitating a trademark.
  -->
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c305d"/>
      <stop offset="1" stop-color="#0a1430"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile behind the shield: without it the icon sits on whatever
       colour the browser's tab strip happens to be, and the navy shield
       disappears into a dark theme. -->
  <rect width="512" height="512" rx="112" ry="112" fill="#060e22"/>

  <!-- Shield. Stroke is 22px here (~0.7px at 16 square) so the silver edge
       still registers rather than dropping out entirely. -->
  <path
    d="M256 54 L436 110 V266 c0 100 -76 168 -180 192 C152 434 76 366 76 266 V110 Z"
    fill="url(#navy)"
    stroke="#c4cad6"
    stroke-width="22"
    stroke-linejoin="round"
  />

  <!-- Red band, full width of the shield so it reads as a stripe and not a
       stray shape once the detail goes. -->
  <path d="M76 218 h360 v76 H76 Z" fill="#d50a0a"/>

  <!-- Football. Only the centre seam and two cross-laces are kept; the four
       of the header mark turn to mush below about 24px. -->
  <ellipse cx="256" cy="256" rx="104" ry="62" fill="#ffffff"/>
  <g stroke="#0a1430" stroke-width="18" stroke-linecap="round">
    <path d="M198 256 H314"/>
    <path d="M232 232 V280"/>
    <path d="M280 232 V280"/>
  </g>
</svg>
