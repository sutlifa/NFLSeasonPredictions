<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NFL Predictions app icon">
  <!--
    The header mark (public/logo-mark.svg) redrawn for a browser tab, and
    compared against three alternatives at 16, 20, 32 and 64 on both a light
    and a dark tab strip before settling here.

    Why the shield is RED when the header's is navy: the header mark needs a
    tile behind it or it vanishes into a dark tab strip, but a navy shield on
    a dark tile is one blob at 16px, with only a hairline of silver between
    them. Red is the one colour in the palette that holds up against both a
    white strip and a near black one.

    Everything is oversized relative to the header mark, because comfortable
    proportions on a 512px artboard are sub pixel at 16.

    NOTE FOR EDITORS: no double hyphen anywhere inside these comments. XML
    forbids it, and an SVG that fails to parse does not fall back to
    something plainer, it fails to render at all. Chrome quietly shows its
    default globe instead, which is exactly how this file shipped broken
    once already.

    Deliberately NOT a copy of the league's shield: this is an unaffiliated
    fan pool, so the mark borrows the palette and the silhouette family
    without imitating a trademark.
  -->

  <rect width="512" height="512" rx="104" ry="104" fill="#0a1430"/>

  <path
    d="M256 32 L462 92 V272 c0 108 -84 182 -206 210 C130 456 50 382 50 272 V92 Z"
    fill="#d50a0a"
    stroke="#c4cad6"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <ellipse cx="256" cy="248" rx="130" ry="80" fill="#ffffff"/>
  <g stroke="#0a1430" stroke-width="24" stroke-linecap="round">
    <path d="M182 248 H330"/>
    <path d="M224 216 V280"/>
    <path d="M288 216 V280"/>
  </g>
</svg>
